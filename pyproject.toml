[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pulsescan"
version = "0.1.0"
description = "A modular toolkit for system visibility, network diagnostics, and workflow automation"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Networking",
]
dependencies = [
    "psutil>=5.8.0",
    "flask>=2.0.0",
    "requests>=2.25.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/pulsescan"
Repository = "https://github.com/yourusername/pulsescan.git"
Issues = "https://github.com/yourusername/pulsescan/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["pulsescan*"]

[tool.setuptools.package-data]
pulsescan = ["*.txt", "*.md"]